name: Build Eurobox v90 guided clamp

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/build_v90_guided_clamp.py"
      - ".github/workflows/build-v90.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - name: Install runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 openscad

      - name: Cache FreeCAD AppImage
        id: freecad-cache
        uses: actions/cache@v5
        with:
          path: FreeCAD.AppImage
          key: freecad-1.1.3-linux-x86_64-py311

      - name: Download verified FreeCAD 1.1.3
        if: steps.freecad-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o FreeCAD.AppImage \
            https://github.com/FreeCAD/FreeCAD/releases/download/1.1.3/FreeCAD_1.1.3-Linux-x86_64-py311.AppImage

      - name: Verify and extract FreeCAD
        run: |
          set -euo pipefail
          echo "3a853eb69ee595f779f2255dbf80a765926981d8ff68903cefee4dfb03a8f5ef  FreeCAD.AppImage" | sha256sum -c -
          chmod +x FreeCAD.AppImage
          rm -rf squashfs-root
          ./FreeCAD.AppImage --appimage-extract >/dev/null
          FREECADCMD=$(find squashfs-root -type f \( -name FreeCADCmd -o -name freecadcmd \) | head -n1)
          test -n "$FREECADCMD"
          echo "FREECADCMD=$FREECADCMD" >> "$GITHUB_ENV"
          "$FREECADCMD" -c 'import FreeCAD,Part,Mesh,Import; print(FreeCAD.Version()); assert Part.makeBox(1,1,1).isValid()'

      - name: Compile v90 builder
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/build_v90_guided_clamp.py

      - name: Build and hard-check v90
        run: |
          set -euo pipefail
          rm -rf build_v90
          "$FREECADCMD" -c "import sys; sys.path.insert(0, 'scripts'); import build_v90_guided_clamp" 2>&1 | tee build_v90.log

          # Re-render the retaining pin from its authoritative SCAD source.
          # The previously published STL was geometrically closed but had 128
          # shared edges with identical winding, which PrusaSlicer reports as
          # mesh errors. OpenSCAD emits a consistently oriented binary mesh.
          openscad --export-format binstl \
            -o build_v90/eurobox_v90_lead_nut_retaining_pin.stl \
            cad/v80/SCAD/eurobox_v80_lead_nut_retaining_pin.scad

          test -s build_v90/eurobox_v90_base_right.step
          test -s build_v90/eurobox_v90_base_left.step
          test -s build_v90/eurobox_v90_clamp.step
          test -s build_v90/eurobox_v90_base_right.FCStd
          test -s build_v90/eurobox_v90_base_left.FCStd
          test -s build_v90/eurobox_v90_clamp.FCStd
          test -s build_v90/eurobox_v90_base_right.stl
          test -s build_v90/eurobox_v90_base_left.stl
          test -s build_v90/eurobox_v90_clamp.stl
          test -s build_v90/eurobox_v90_lead_nut_retaining_pin.stl
          test -s build_v90/VALIDATION_v90.json

          python3 - <<'PY'
          import json, struct
          from pathlib import Path

          v = json.loads(Path('build_v90/VALIDATION_v90.json').read_text())
          assert v['failures'] == []
          assert abs(v['guide']['pin_d_mm'] - 10.0) < 1e-9
          assert abs(v['guide']['bore_d_mm'] - 10.15) < 1e-9
          assert v['guide']['vertical_bore_ligament_mm'] > 9.9
          assert v['guide']['base_lead_nut_pocket_to_guide_ligament_mm'] > 11.0
          assert v['guide']['pin_spacing_mm'] > 100.0

          def oriented_edge_errors(path):
              data = Path(path).read_bytes()
              n = struct.unpack('<I', data[80:84])[0]
              edges = {}
              def vk(v):
                  return tuple(round(x, 6) for x in v)
              for i in range(n):
                  off = 84 + 50*i
                  vs = [
                      struct.unpack('<3f', data[off+12+12*j:off+24+12*j])
                      for j in range(3)
                  ]
                  ks = [vk(v) for v in vs]
                  for a, b in ((0,1),(1,2),(2,0)):
                      lo, hi = sorted((ks[a], ks[b]))
                      key = (lo, hi)
                      direction = 1 if ks[a] < ks[b] else -1
                      edges.setdefault(key, []).append(direction)
              boundary = sum(1 for ds in edges.values() if len(ds) == 1)
              nonmanifold = sum(1 for ds in edges.values() if len(ds) > 2)
              same_winding = sum(
                  1 for ds in edges.values()
                  if len(ds) == 2 and ds[0] == ds[1]
              )
              return boundary, nonmanifold, same_winding

          for p in Path('build_v90').glob('*.stl'):
              data = p.read_bytes()
              assert len(data) >= 84, p
              n = struct.unpack('<I', data[80:84])[0]
              assert len(data) == 84 + 50*n, f'{p} is not canonical binary STL'

          pin = Path('build_v90/eurobox_v90_lead_nut_retaining_pin.stl')
          boundary, nonmanifold, same_winding = oriented_edge_errors(pin)
          assert boundary == 0, f'{pin}: {boundary} boundary edges'
          assert nonmanifold == 0, f'{pin}: {nonmanifold} non-manifold edges'
          assert same_winding == 0, f'{pin}: {same_winding} same-winding shared edges'
          PY

      - name: Publish complete validated v90 CAD set
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          mkdir -p cad/v90/FCStd cad/v90/STEP cad/v90/STL cad/v90/SCAD cad/v90/validation preview-stl/v90

          rm -f cad/v90/FCStd/eurobox_v90_*.FCStd
          rm -f cad/v90/STEP/eurobox_v90_*.step
          rm -f cad/v90/STL/eurobox_v90_*.stl
          rm -f cad/v90/SCAD/eurobox_v90_*.scad
          rm -f preview-stl/v90/eurobox_v90_*.stl

          # V90-native changed parts: guided bases + guided clamp.
          cp build_v90/eurobox_v90_*.FCStd cad/v90/FCStd/
          cp build_v90/eurobox_v90_*.step cad/v90/STEP/
          cp build_v90/eurobox_v90_*.stl cad/v90/STL/

          # All unchanged V80 components are promoted into the V90 namespace.
          # Binary CAD is copied byte-for-byte; no binary file is rewritten as text.
          for src in cad/v80/FCStd/eurobox_v80_*.FCStd; do
            base=$(basename "$src")
            case "$base" in
              eurobox_v80_base_left.FCStd|eurobox_v80_base_right.FCStd) continue ;;
            esac
            dst=${base/eurobox_v80_/eurobox_v90_}
            cp "$src" "cad/v90/FCStd/$dst"
          done

          for src in cad/v80/STEP/eurobox_v80_*.step; do
            base=$(basename "$src")
            case "$base" in
              eurobox_v80_base_left.step|eurobox_v80_base_right.step) continue ;;
            esac
            dst=${base/eurobox_v80_/eurobox_v90_}
            cp "$src" "cad/v90/STEP/$dst"
          done

          for src in cad/v80/STL/eurobox_v80_*.stl; do
            base=$(basename "$src")
            case "$base" in
              eurobox_v80_base_left.stl|eurobox_v80_base_right.stl|eurobox_v80_clamp.stl) continue ;;
            esac
            dst=${base/eurobox_v80_/eurobox_v90_}
            cp "$src" "cad/v90/STL/$dst"
          done

          # Replace the old retaining-pin STL in BOTH V80 and V90 with the
          # freshly rendered, consistently oriented binary mesh. Keeping V80
          # fixed is essential because V90 inherits this part from V80.
          cp build_v90/eurobox_v90_lead_nut_retaining_pin.stl \
            cad/v80/STL/eurobox_v80_lead_nut_retaining_pin.stl
          cp build_v90/eurobox_v90_lead_nut_retaining_pin.stl \
            cad/v90/STL/eurobox_v90_lead_nut_retaining_pin.stl

          # Preserve the source files for the V80-derived printable-only parts.
          # The old V80 clamp source is intentionally NOT copied because the V90
          # clamp is generated by scripts/build_v90_guided_clamp.py.
          for src in cad/v80/SCAD/eurobox_v80_*.scad; do
            base=$(basename "$src")
            [ "$base" = "eurobox_v80_clamp.scad" ] && continue
            dst=${base/eurobox_v80_/eurobox_v90_}
            cp "$src" "cad/v90/SCAD/$dst"
          done

          cp cad/v90/STL/eurobox_v90_*.stl preview-stl/v90/
          cp build_v90/VALIDATION_v90.json cad/v90/validation/

          # Completeness gate: V90 must expose every printable component V80 had,
          # with only base_left/base_right/clamp replaced by V90-native geometry.
          python3 - <<'PY'
          import struct
          from pathlib import Path

          v80 = {p.name.replace('eurobox_v80_', '') for p in Path('cad/v80/STL').glob('eurobox_v80_*.stl')}
          v90 = {p.name.replace('eurobox_v90_', '') for p in Path('cad/v90/STL').glob('eurobox_v90_*.stl')}
          missing = sorted(v80 - v90)
          extra = sorted(v90 - v80)
          assert not missing, f'V90 missing printable V80 parts: {missing}'
          assert not extra, f'V90 has unexpected printable parts: {extra}'
          assert len(v90) == 14, f'expected 14 printable V90 parts, got {len(v90)}: {sorted(v90)}'

          required = {
              'base_left.stl', 'base_right.stl', 'bushing_half.stl', 'clamp.stl',
              'knob.stl', 'lead_nut.stl', 'lead_nut_pin_clip.stl',
              'lead_nut_retaining_pin.stl', 'lead_screw.stl',
              'rack_hand_knob.stl', 'rack_lower.stl', 'rack_nut_retainer.stl',
              'rack_pin.stl', 'rack_pin_clip.stl',
          }
          assert v90 == required, f'V90 component manifest mismatch: {sorted(v90)}'

          # Every published STL, including inherited V80 components, must remain
          # canonical binary STL. This explicitly prevents ASCII STL in v90.
          for p in sorted(Path('cad/v90/STL').glob('eurobox_v90_*.stl')):
              data = p.read_bytes()
              assert len(data) >= 84, p
              n = struct.unpack('<I', data[80:84])[0]
              assert len(data) == 84 + 50*n, f'{p} is not canonical binary STL'

          # Regression gate for the exact 128-error retaining-pin failure.
          pin = Path('cad/v90/STL/eurobox_v90_lead_nut_retaining_pin.stl')
          data = pin.read_bytes()
          n = struct.unpack('<I', data[80:84])[0]
          edges = {}
          def vk(v):
              return tuple(round(x, 6) for x in v)
          for i in range(n):
              off = 84 + 50*i
              vs = [
                  struct.unpack('<3f', data[off+12+12*j:off+24+12*j])
                  for j in range(3)
              ]
              ks = [vk(v) for v in vs]
              for a, b in ((0,1),(1,2),(2,0)):
                  lo, hi = sorted((ks[a], ks[b]))
                  key = (lo, hi)
                  direction = 1 if ks[a] < ks[b] else -1
                  edges.setdefault(key, []).append(direction)
          assert all(len(ds) == 2 for ds in edges.values()), 'retaining pin is not a closed 2-manifold'
          assert all(ds[0] != ds[1] for ds in edges.values()), 'retaining pin has inconsistent shared-edge winding'
          PY

          cat > cad/v90/README.md <<'EOF'
          # Eurobox carrier v90

          V90 adds a full-length two-pin guide between the box clamp and the base while keeping the complete V80 clamp travel.

          V90-native changed parts:

          - `base_left` / `base_right`: two full-length cylindrical guide sleeves through the remote box-clamp crosshead.
          - `clamp`: two integral Ø10 mm guide pins with lightly rounded tips.

          Guide geometry:

          - pin diameter: Ø10.00 mm
          - base guide bore: Ø10.15 mm
          - two pin axes remain fully engaged through the complete base crosshead at every clamp setting
          - maximum design gap clamp→base: 30 mm
          - pins may protrude about 30 mm behind the base at maximum gap
          - guide pins are placed 25 mm inboard from the two existing clamp screw axes

          Complete printable V90 set:

          - base_left
          - base_right
          - bushing_half
          - clamp
          - knob
          - lead_nut
          - lead_nut_pin_clip
          - lead_nut_retaining_pin
          - lead_screw
          - rack_hand_knob
          - rack_lower
          - rack_nut_retainer
          - rack_pin
          - rack_pin_clip

          All components other than the two bases and clamp are promoted unchanged from V80 into the V90 namespace. Where V80 provides FCStd/STEP source files, they are copied as well. Printable-only V80 parts retain their SCAD source under `SCAD/`; the V90 clamp itself is generated by `scripts/build_v90_guided_clamp.py`.

          Every V90 STL is hard-checked as canonical **binary STL** before publication. ASCII STL is rejected.
          EOF

          cat > preview-stl/v90/README.md <<'EOF'
          # v90 preview/print meshes

          Complete binary STL mirror of `cad/v90/STL/`, including the V90-native guided bases/clamp and every unchanged printable component promoted from V80.
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cad/v90 preview-stl/v90
          if git diff --cached --quiet; then
            echo "Validated complete v90 repository outputs already current"
          else
            git commit -m "Publish complete guided-clamp v90 CAD set"
            git pull --rebase origin main
            git push
          fi

      - name: Upload complete v90 proof
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: eurobox-v90-guided-clamp
          path: |
            build_v90/VALIDATION_v90.json
            build_v90/eurobox_v90_*.step
            build_v90/eurobox_v90_*.FCStd
            build_v90/eurobox_v90_*.stl
            build_v90.log
