name: Build Eurobox v50

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/build_v50.py"
      - "scripts/diagnose_v50_base.py"
      - "scripts/validate_meshes.py"
      - "docs/V50_**"
      - "docs/MEASUREMENTS.md"
      - "docs/FOCUS_THRON2_EQP_2023.md"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenSCAD and mesh checks
        run: |
          sudo apt-get update
          sudo apt-get install -y openscad libfuse2
          python3 -m pip install --break-system-packages trimesh

      - name: Cache FreeCAD AppImage
        id: cache-freecad
        uses: actions/cache@v4
        with:
          path: FreeCAD.AppImage
          key: freecad-1.1.3-linux-x86_64-py311

      - name: Download verified FreeCAD 1.1.3
        if: steps.cache-freecad.outputs.cache-hit != 'true'
        run: |
          curl -L --fail --retry 3 -o FreeCAD.AppImage \
            https://github.com/FreeCAD/FreeCAD/releases/download/1.1.3/FreeCAD_1.1.3-Linux-x86_64-py311.AppImage

      - name: Verify and extract FreeCAD
        run: |
          set -euo pipefail
          echo "3a853eb69ee595f779f2255dbf80a765926981d8ff68903cefee4dfb03a8f5ef  FreeCAD.AppImage" | sha256sum -c -
          chmod +x FreeCAD.AppImage
          rm -rf squashfs-root
          ./FreeCAD.AppImage --appimage-extract >/dev/null
          FREECADCMD=$(find squashfs-root -type f \( -name FreeCADCmd -o -name freecadcmd \) | head -n1)
          test -n "$FREECADCMD"
          echo "FREECADCMD=$FREECADCMD" >> "$GITHUB_ENV"
          "$FREECADCMD" -c 'import FreeCAD,Part; print(FreeCAD.Version()); s=Part.makeBox(1,1,1); assert s.isValid()'

      - name: Build and validate v50 CAD
        id: cadbuild
        run: |
          set -euo pipefail
          START=$(date +%s)
          "$FREECADCMD" scripts/build_v50.py | tee build_v50.log
          END=$(date +%s)
          echo $((END-START)) > build_v50/build_seconds.txt
          test -s build_v50/VALIDATION_v50_source.json
          test -s build_v50/eurobox_v50_assembly.FCStd

      - name: Print hard-check diagnostics
        if: always()
        run: |
          if [ -s build_v50/VALIDATION_v50_source.json ]; then
            python3 - <<'PY'
          import json
          p='build_v50/VALIDATION_v50_source.json'
          v=json.load(open(p))
          print('V50_FAILURES='+json.dumps(v.get('failures', []), ensure_ascii=False))
          keys=['tube_base_common_mm3','rack_lower_checks','rack_pin_checks','base_box_rim_common_mm3','plate_motion','plate_hole_probe_common_mm3','lead_nut_checks','thread_kinematics','wrong_phase_0_5mm_nut_common_mm3','anti_rotation','beam_sanity','system_width_estimate_mm']
          print('V50_DIAGNOSTIC='+json.dumps({k:v.get(k) for k in keys}, ensure_ascii=False))
          PY
          else
            echo 'VALIDATION_v50_source.json missing'
          fi

      - name: Diagnose base topology after CAD failure
        if: steps.cadbuild.outcome == 'failure'
        run: |
          set -o pipefail
          "$FREECADCMD" scripts/diagnose_v50_base.py | tee base_debug.log || true

      - name: Upload pre-mesh validation on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eurobox-v50-prevalidation
          path: |
            build_v50/VALIDATION_v50_source.json
            build_v50/BASE_DEBUG_v50.json
            build_v50/DEBUG_v50_base.brep
            build_v50.log
            base_debug.log
          if-no-files-found: warn
          retention-days: 7

      - name: Validate STL meshes
        if: steps.cadbuild.outcome == 'success'
        run: python3 scripts/validate_meshes.py build_v50

      - name: Copy design documentation into artifact
        if: steps.cadbuild.outcome == 'success'
        run: |
          mkdir -p build_v50/docs
          cp docs/V50_DESIGN.md docs/V50_DIMENSIONS.json docs/MEASUREMENTS.md docs/FOCUS_THRON2_EQP_2023.md docs/VALIDATION_V50.md build_v50/docs/
          cp build_v50.log build_v50/

      - name: Package output
        if: steps.cadbuild.outcome == 'success'
        run: |
          (cd build_v50 && zip -9 -r ../eurobox-v50.zip .)

      - name: Upload complete v50 build
        if: steps.cadbuild.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: eurobox-v50
          path: eurobox-v50.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload validation reports
        if: steps.cadbuild.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: eurobox-v50-validation
          path: |
            build_v50/VALIDATION_v50_source.json
            build_v50/MESH_VALIDATION.json
            build_v50/build_seconds.txt
            build_v50.log
          if-no-files-found: error
          retention-days: 14
