name: Build Eurobox v50

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/build_v50.py"
      - "scripts/apply_v50_fixups.py"
      - "scripts/apply_v50_clamp_fixups.py"
      - "scripts/diagnose_v50_base.py"
      - "scripts/validate_meshes.py"
      - "scripts/validate_assembly_layout.py"
      - "scripts/validate_box_clamp.py"
      - "scripts/preview_v50.scad"
      - "scripts/final_print_meshes.scad"
      - "docs/V50_**"
      - "docs/MEASUREMENTS.md"
      - "docs/FOCUS_THRON2_EQP_2023.md"
      - ".github/workflows/build.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenSCAD, preview and mesh checks
        run: |
          sudo apt-get update
          sudo apt-get install -y openscad libfuse2 xvfb
          python3 -m pip install --break-system-packages trimesh networkx

      - name: Cache FreeCAD AppImage
        id: cache-freecad
        uses: actions/cache@v4
        with:
          path: FreeCAD.AppImage
          key: freecad-1.1.3-linux-x86_64-py311

      - name: Download verified FreeCAD 1.1.3
        if: steps.cache-freecad.outputs.cache-hit != 'true'
        run: |
          curl -L --fail --retry 3 -o FreeCAD.AppImage \
            https://github.com/FreeCAD/FreeCAD/releases/download/1.1.3/FreeCAD_1.1.3-Linux-x86_64-py311.AppImage

      - name: Verify and extract FreeCAD
        run: |
          set -euo pipefail
          echo "3a853eb69ee595f779f2255dbf80a765926981d8ff68903cefee4dfb03a8f5ef  FreeCAD.AppImage" | sha256sum -c -
          chmod +x FreeCAD.AppImage
          rm -rf squashfs-root
          ./FreeCAD.AppImage --appimage-extract >/dev/null
          FREECADCMD=$(find squashfs-root -type f \( -name FreeCADCmd -o -name freecadcmd \) | head -n1)
          test -n "$FREECADCMD"
          echo "FREECADCMD=$FREECADCMD" >> "$GITHUB_ENV"
          "$FREECADCMD" -c 'import FreeCAD,Part; print(FreeCAD.Version()); s=Part.makeBox(1,1,1); assert s.isValid()'

      - name: Apply v50 source fixups
        run: |
          set -euo pipefail
          python3 scripts/apply_v50_fixups.py
          python3 scripts/apply_v50_clamp_fixups.py
          python3 -m py_compile scripts/build_v50.py scripts/validate_box_clamp.py

      - name: Build and validate v50 CAD
        id: cadbuild
        run: |
          set -euo pipefail
          START=$(date +%s)
          "$FREECADCMD" scripts/build_v50.py | tee build_v50.log
          END=$(date +%s)
          echo $((END-START)) > build_v50/build_seconds.txt
          test -s build_v50/VALIDATION_v50_source.json
          test -s build_v50/eurobox_v50_assembly.FCStd

      - name: Validate global assembly orientation
        if: steps.cadbuild.outcome == 'success'
        run: |
          set -euo pipefail
          python3 scripts/validate_assembly_layout.py build_v50
          test -s build_v50/ASSEMBLY_LAYOUT_VALIDATION.json

      - name: Validate box clamp mechanism
        if: steps.cadbuild.outcome == 'success'
        env:
          EUROBOX_BUILD_DIR: build_v50
        run: |
          set -euo pipefail
          rm -f build_v50/BOX_CLAMP_VALIDATION.json build_v50/BOX_CLAMP_CHECKPOINT.json build_v50/BOX_CLAMP_EXCEPTION.json
          set +e
          "$FREECADCMD" -c "import runpy; runpy.run_path('scripts/validate_box_clamp.py', run_name='__main__')"
          freecad_rc=$?
          set -e
          echo "Clamp validator FreeCADCmd exit code: $freecad_rc"

          if [ -s build_v50/BOX_CLAMP_CHECKPOINT.json ]; then
            echo "---- BOX_CLAMP_CHECKPOINT.json ----"
            cat build_v50/BOX_CLAMP_CHECKPOINT.json
          fi
          if [ -s build_v50/BOX_CLAMP_EXCEPTION.json ]; then
            echo "---- BOX_CLAMP_EXCEPTION.json ----"
            cat build_v50/BOX_CLAMP_EXCEPTION.json
          fi
          if [ -s build_v50/BOX_CLAMP_VALIDATION.json ]; then
            echo "---- BOX_CLAMP_VALIDATION.json ----"
            cat build_v50/BOX_CLAMP_VALIDATION.json
          else
            echo "::error::Clamp validator did not create build_v50/BOX_CLAMP_VALIDATION.json"
            exit 1
          fi

          # FreeCADCmd can print a Python exception yet still return exit code 0,
          # so the completed report remains the authoritative mechanical result.
          python3 - <<'PY'
          import json
          p='build_v50/BOX_CLAMP_VALIDATION.json'
          v=json.load(open(p))
          assert not v.get('diagnostic_only'), v
          assert not v.get('failed'), v.get('failed')
          PY

          if [ "$freecad_rc" -ne 0 ]; then
            exit "$freecad_rc"
          fi

      - name: Print hard-check diagnostics
        if: always()
        run: |
          if [ -s build_v50/VALIDATION_v50_source.json ]; then
            python3 - <<'PY'
          import json
          p='build_v50/VALIDATION_v50_source.json'
          v=json.load(open(p))
          print('V50_FAILURES='+json.dumps(v.get('failures', []), ensure_ascii=False))
          keys=['frozen_interface_assertions','tube_base_common_mm3','rack_lower_checks','rack_lower_sweep','rack_pin_checks','base_box_rim_common_mm3','plate_motion','plate_hole_probe_common_mm3','lead_nut_checks','thread_kinematics','wrong_phase_0_5mm_nut_common_mm3','anti_rotation','beam_sanity','system_width_estimate_mm']
          print('V50_DIAGNOSTIC='+json.dumps({k:v.get(k) for k in keys}, ensure_ascii=False))
          PY
          else
            echo 'VALIDATION_v50_source.json missing'
          fi
          if [ -s build_v50/ASSEMBLY_LAYOUT_VALIDATION.json ]; then
            cat build_v50/ASSEMBLY_LAYOUT_VALIDATION.json
          fi
          if [ -s build_v50/BOX_CLAMP_VALIDATION.json ]; then
            cat build_v50/BOX_CLAMP_VALIDATION.json
          fi
          if [ -s build_v50/BOX_CLAMP_CHECKPOINT.json ]; then
            cat build_v50/BOX_CLAMP_CHECKPOINT.json
          fi
          if [ -s build_v50/BOX_CLAMP_EXCEPTION.json ]; then
            cat build_v50/BOX_CLAMP_EXCEPTION.json
          fi

      - name: Diagnose base topology after CAD failure
        if: failure()
        run: |
          set -o pipefail
          "$FREECADCMD" scripts/diagnose_v50_base.py | tee base_debug.log || true

      - name: Upload pre-mesh validation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eurobox-v50-prevalidation
          path: |
            build_v50/VALIDATION_v50_source.json
            build_v50/ASSEMBLY_LAYOUT_VALIDATION.json
            build_v50/BOX_CLAMP_VALIDATION.json
            build_v50/BOX_CLAMP_CHECKPOINT.json
            build_v50/BOX_CLAMP_EXCEPTION.json
            build_v50/BASE_DEBUG_v50.json
            build_v50/DEBUG_v50_base.brep
            build_v50.log
            base_debug.log
          if-no-files-found: warn
          retention-days: 7

      - name: Generate final printable spindle mesh
        if: steps.cadbuild.outcome == 'success'
        run: |
          set -euo pipefail
          cp build_v50/eurobox_v50_lead_screw_print.stl build_v50/eurobox_v50_lead_screw_BREP_export_reference.mesh-reference
          openscad -D 'part="spindle"' \
            -o build_v50/eurobox_v50_lead_screw_print.stl \
            scripts/final_print_meshes.scad
          test -s build_v50/eurobox_v50_lead_screw_print.stl
          cp scripts/final_print_meshes.scad build_v50/final_print_meshes.scad

      - name: Validate STL meshes
        if: steps.cadbuild.outcome == 'success'
        run: python3 scripts/validate_meshes.py build_v50

      - name: Render v50 preview
        if: steps.cadbuild.outcome == 'success'
        run: |
          set -euo pipefail
          xvfb-run -a openscad \
            --imgsize=1800,1200 \
            --projection=p \
            --viewall \
            --autocenter \
            -o build_v50/PREVIEW_v50.png \
            scripts/preview_v50.scad
          test -s build_v50/PREVIEW_v50.png
          cp scripts/preview_v50.scad build_v50/PREVIEW_v50.scad

      - name: Copy design documentation into artifact
        if: steps.cadbuild.outcome == 'success'
        run: |
          mkdir -p build_v50/docs
          cp docs/V50_DESIGN.md docs/V50_DIMENSIONS.json docs/MEASUREMENTS.md docs/FOCUS_THRON2_EQP_2023.md docs/VALIDATION_V50.md docs/DESIGN_V50.md build_v50/docs/
          cp build_v50.log build_v50/

      - name: Verify deliverables
        if: steps.cadbuild.outcome == 'success'
        run: |
          set -euo pipefail
          test -s build_v50/eurobox_v50_assembly.FCStd
          test -s build_v50/eurobox_v50_base.FCStd
          test -s build_v50/eurobox_v50_base.step
          test -s build_v50/eurobox_v50_base.stl
          test -s build_v50/eurobox_v50_clamp_plate.FCStd
          test -s build_v50/eurobox_v50_clamp_plate.step
          test -s build_v50/eurobox_v50_clamp_plate.stl
          test -s build_v50/eurobox_v50_rack_lower.FCStd
          test -s build_v50/eurobox_v50_rack_lower.step
          test -s build_v50/eurobox_v50_rack_lower.stl
          test -s build_v50/eurobox_v50_lead_screw_print.FCStd
          test -s build_v50/eurobox_v50_lead_screw_print.step
          test -s build_v50/eurobox_v50_lead_screw_print.stl
          test -s build_v50/eurobox_v50_knob.FCStd
          test -s build_v50/eurobox_v50_knob.step
          test -s build_v50/eurobox_v50_knob.stl
          test -s build_v50/PREVIEW_v50.png
          test -s build_v50/VALIDATION_v50_source.json
          test -s build_v50/ASSEMBLY_LAYOUT_VALIDATION.json
          test -s build_v50/BOX_CLAMP_VALIDATION.json
          test -s build_v50/MESH_VALIDATION.json
          python3 - <<'PY'
          import json
          m=json.load(open('build_v50/MESH_VALIDATION.json'))
          a=json.load(open('build_v50/ASSEMBLY_LAYOUT_VALIDATION.json'))
          c=json.load(open('build_v50/BOX_CLAMP_VALIDATION.json'))
          assert not m['failed'], m['failed']
          assert not a['failed'], a['failed']
          assert not c['failed'], c['failed']
          PY

      - name: Publish validated CAD files into repository
        if: steps.cadbuild.outcome == 'success' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          rm -rf cad/v50 preview-stl/v50
          mkdir -p cad/v50/FCStd cad/v50/STEP cad/v50/STL cad/v50/assembly preview-stl/v50

          find build_v50 -maxdepth 1 -type f -name '*.FCStd' ! -name 'eurobox_v50_assembly.FCStd' -exec cp {} cad/v50/FCStd/ \;
          find build_v50 -maxdepth 1 -type f -name 'eurobox_v50_*.step' -exec cp {} cad/v50/STEP/ \;
          find build_v50 -maxdepth 1 -type f -name 'eurobox_v50_*.stl' -exec cp {} cad/v50/STL/ \;

          cp build_v50/eurobox_v50_assembly.FCStd cad/v50/assembly/
          cp build_v50/PREVIEW_v50.png cad/v50/assembly/PREVIEW_v50.png
          openscad -o cad/v50/assembly/ASSEMBLY_PREVIEW_v50.stl scripts/preview_v50.scad
          test -s cad/v50/assembly/ASSEMBLY_PREVIEW_v50.stl

          # Keep the lightweight GitHub-preview tree in sync with the validated STL set.
          cp cad/v50/STL/*.stl preview-stl/v50/
          cp cad/v50/assembly/ASSEMBLY_PREVIEW_v50.stl preview-stl/v50/
          cp cad/v50/assembly/PREVIEW_v50.png preview-stl/v50/
          cat > preview-stl/v50/README.md <<'EOF'
          # Eurobox v50 preview files

          This directory mirrors the validated printable STL files from `cad/v50/STL/` and also contains the generated assembly preview and PNG overview for convenient GitHub browsing.

          These files are generated automatically after all CAD, clamp, assembly and mesh validation checks pass.
          EOF

          oversize_stl=$(find cad/v50 preview-stl/v50 -type f -name '*.stl' -size +9999999c -print)
          if [ -n "$oversize_stl" ]; then
            echo "STL file(s) too large for GitHub 3D preview:"
            echo "$oversize_stl"
            exit 1
          fi

          oversize_repo=$(find cad/v50 preview-stl/v50 -type f -size +95000000c -print)
          if [ -n "$oversize_repo" ]; then
            echo "CAD file(s) too large for normal GitHub repository storage:"
            echo "$oversize_repo"
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path
          fc = {p.stem for p in Path('cad/v50/FCStd').glob('*.FCStd')}
          st = {p.stem for p in Path('cad/v50/STEP').glob('*.step')}
          sl = {p.stem for p in Path('cad/v50/STL').glob('*.stl')}
          missing = {
              'FCStd_without_STEP': sorted(fc-st),
              'FCStd_without_STL': sorted(fc-sl),
              'STEP_without_FCStd': sorted(st-fc),
              'STL_without_FCStd': sorted(sl-fc),
          }
          bad = {k:v for k,v in missing.items() if v}
          if bad:
              raise SystemExit('CAD publish set mismatch: '+repr(bad))
          preview = {p.stem for p in Path('preview-stl/v50').glob('eurobox_v50_*.stl')}
          if preview != sl:
              raise SystemExit('Preview STL mirror mismatch: '+repr({'missing': sorted(sl-preview), 'extra': sorted(preview-sl)}))
          print(f'Publishing {len(fc)} parts in FCStd + STEP + STL')
          PY

          cat > cad/v50/README.md <<'EOF'
          # Eurobox v50 CAD

          This directory is updated automatically only after successful CAD, assembly-layout, box-clamp and STL-mesh validation.

          - `FCStd/` – one editable FreeCAD file per individual part
          - `STEP/` – the same individual parts as STEP exchange files
          - `STL/` – the same validated printable meshes; click an STL in GitHub for the interactive 3D viewer
          - `assembly/eurobox_v50_assembly.FCStd` – the complete FreeCAD assembly
          - `assembly/ASSEMBLY_PREVIEW_v50.stl` – GitHub-viewable assembly preview only; not a production print part
          - `assembly/PREVIEW_v50.png` – automatically rendered overview

          Files here are generated outputs. The construction logic remains under `scripts/`.
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A cad/v50 preview-stl/v50
          if git diff --cached --quiet; then
            echo "Validated CAD repository files unchanged; nothing to commit."
          else
            git commit -m "Update validated v50 CAD outputs [skip ci]"
            git push
          fi

      - name: Package output
        if: steps.cadbuild.outcome == 'success'
        run: |
          (cd build_v50 && zip -9 -r ../eurobox-v50.zip .)

      - name: Upload complete v50 build
        if: steps.cadbuild.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: eurobox-v50
          path: eurobox-v50.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload v50 preview
        if: steps.cadbuild.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: eurobox-v50-preview
          path: |
            build_v50/PREVIEW_v50.png
            build_v50/PREVIEW_v50.scad
          if-no-files-found: error
          retention-days: 14

      - name: Upload validation reports
        if: steps.cadbuild.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: eurobox-v50-validation
          path: |
            build_v50/VALIDATION_v50_source.json
            build_v50/ASSEMBLY_LAYOUT_VALIDATION.json
            build_v50/BOX_CLAMP_VALIDATION.json
            build_v50/MESH_VALIDATION.json
            build_v50/build_seconds.txt
            build_v50.log
          if-no-files-found: error
          retention-days: 14