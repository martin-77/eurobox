name: Build Eurobox v49

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "inputs/**"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenSCAD and Python checks
        run: |
          sudo apt-get update
          sudo apt-get install -y openscad libfuse2
          python3 -m pip install --break-system-packages trimesh

      - name: Restore baseline BREP inputs
        run: |
          mkdir -p inputs_decoded
          for f in inputs/*.brep.gz.b64; do
            n=$(basename "$f" .gz.b64)
            base64 -d "$f" | gzip -d > "inputs_decoded/$n"
          done
          ls -lh inputs_decoded

      - name: Download verified FreeCAD 1.1.3
        run: |
          curl -L --fail --retry 3 -o FreeCAD.AppImage \
            https://github.com/FreeCAD/FreeCAD/releases/download/1.1.3/FreeCAD_1.1.3-Linux-x86_64-py311.AppImage
          echo "3a853eb69ee595f779f2255dbf80a765926981d8ff68903cefee4dfb03a8f5ef  FreeCAD.AppImage" | sha256sum -c -
          chmod +x FreeCAD.AppImage
          ./FreeCAD.AppImage --appimage-extract >/dev/null

      - name: Build and validate CAD
        run: |
          START=$(date +%s)
          ./squashfs-root/usr/bin/FreeCADCmd scripts/build_v49.py | tee build.log
          END=$(date +%s)
          echo $((END-START)) > build/build_seconds.txt

      - name: Validate STL meshes
        run: python3 scripts/validate_meshes.py

      - name: Package output
        run: |
          cp build.log build/
          (cd build && zip -9 -r ../eurobox-v49.zip .)

      - name: Upload complete build
        uses: actions/upload-artifact@v4
        with:
          name: eurobox-v49
          path: eurobox-v49.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload raw reports
        uses: actions/upload-artifact@v4
        with:
          name: eurobox-v49-validation
          path: |
            build/VALIDATION_v49_source.json
            build/MESH_VALIDATION.json
            build/build_seconds.txt
            build.log
          if-no-files-found: error
          retention-days: 14
