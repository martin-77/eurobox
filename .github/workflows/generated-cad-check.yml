name: Check published Eurobox v50 CAD

on:
  push:
    branches: [main]
    paths:
      - "cad/v50/**"
      - "preview-stl/v50/**"
      - ".github/workflows/generated-cad-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generated-cad:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Install mesh checks
        run: python3 -m pip install --break-system-packages trimesh networkx scipy

      - name: Verify published file sets and STL mirrors
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import trimesh

          root = Path('cad/v50')
          fc_dir = root / 'FCStd'
          step_dir = root / 'STEP'
          stl_dir = root / 'STL'
          mirror_dir = Path('preview-stl/v50')

          for d in (fc_dir, step_dir, stl_dir, mirror_dir):
              if not d.is_dir():
                  raise SystemExit(f'missing directory: {d}')

          fc = {p.stem for p in fc_dir.glob('*.FCStd') if p.stat().st_size > 0}
          st = {p.stem for p in step_dir.glob('*.step') if p.stat().st_size > 0}
          sl = {p.stem for p in stl_dir.glob('*.stl') if p.stat().st_size > 0}
          expected = {
              'eurobox_v50_base',
              'eurobox_v50_base_left',
              'eurobox_v50_base_right',
              'eurobox_v50_clamp_plate',
              'eurobox_v50_rack_lower',
              'eurobox_v50_lead_screw_print',
              'eurobox_v50_lead_nut_print',
              'eurobox_v50_lead_nut_retaining_pin',
              'eurobox_v50_lead_nut_pin_clip',
              'eurobox_v50_knob',
              'eurobox_v50_knob_retainer_nut',
          }

          if fc != expected or st != expected or sl != expected:
              raise SystemExit(
                  'published CAD set mismatch: '
                  f'FCStd missing={sorted(expected-fc)} extra={sorted(fc-expected)}; '
                  f'STEP missing={sorted(expected-st)} extra={sorted(st-expected)}; '
                  f'STL missing={sorted(expected-sl)} extra={sorted(sl-expected)}'
              )

          assembly = root / 'assembly/eurobox_v50_assembly.FCStd'
          preview = root / 'assembly/PREVIEW_v50.png'
          if not assembly.is_file() or assembly.stat().st_size == 0:
              raise SystemExit('missing or empty assembly FCStd')
          if not preview.is_file() or preview.stat().st_size == 0:
              raise SystemExit('missing or empty canonical preview PNG')

          mirror = {p.stem for p in mirror_dir.glob('eurobox_v50_*.stl') if p.stat().st_size > 0}
          if mirror != sl:
              raise SystemExit(f'STL mirror set mismatch: published={sorted(sl)} mirror={sorted(mirror)}')

          def sha256(path):
              h = hashlib.sha256()
              with open(path, 'rb') as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b''):
                      h.update(chunk)
              return h.hexdigest()

          bad_mirrors = []
          bad_meshes = []
          for stem in sorted(sl):
              src = stl_dir / f'{stem}.stl'
              dst = mirror_dir / f'{stem}.stl'
              if sha256(src) != sha256(dst):
                  bad_mirrors.append(stem)
              mesh = trimesh.load(src, force='mesh', process=True)
              if not mesh.is_watertight or not mesh.is_winding_consistent or abs(float(mesh.volume)) <= 0:
                  bad_meshes.append({
                      'name': stem,
                      'watertight': bool(mesh.is_watertight),
                      'winding_consistent': bool(mesh.is_winding_consistent),
                      'volume_mm3': abs(float(mesh.volume)),
                  })

          if bad_mirrors:
              raise SystemExit(f'STL mirror hash mismatch: {bad_mirrors}')
          if bad_meshes:
              raise SystemExit(f'published STL mesh validation failed: {bad_meshes}')

          print(f'PASS: {len(sl)} published STL meshes are watertight and byte-identical to preview mirror')
          PY
