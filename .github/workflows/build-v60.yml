name: Build Eurobox v60

# v60 is the canonical production CAD build on main. Legacy v50 workflows were
# retired after the clean rebuild replaced the source-rewriting repair chain.
on:
  workflow_dispatch:
  push:
    branches: [main, v60-clean, fix/v60-v50-box-clamp-thread-access]
    paths:
      - "scripts/build_v60.py"
      - "scripts/build_v60_continuous_carrier.py"
      - "scripts/build_v60_full.py"
      - "scripts/build_v60_full_baseline.py"
      - "scripts/apply_v60_box_clamp_prereq.py"
      - "scripts/apply_v60_front_rebuild_v2.py"
      - "scripts/apply_v60_front_rebuild_v5.py"
      - "scripts/apply_v60_front_rebuild_v6.py"
      - "scripts/apply_v60_front_rework.py"
      - "scripts/apply_v60_front_final.py"
      - "scripts/apply_v60_front_position_fix.py"
      - "scripts/apply_v60_final_assembly.py"
      - "scripts/apply_v60_rack_closure.py"
      - "scripts/apply_v60_retainer_thread_final.py"
      - "scripts/check_v60_all_thread_access.py"
      - "scripts/check_v60_rack_closure_exports.py"
      - "scripts/check_v60_workflow_contract.py"
      - "scripts/run_v60_full_ci.py"
      - "scripts/run_v60_continuous_ci.py"
      - "scripts/v60_timing.py"
      - "scripts/preview_v60.scad"
      - "docs/V60_**"
      - ".github/workflows/build-v60.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  full-direct-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Install runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y openscad libfuse2 xvfb

      - name: Cache FreeCAD AppImage
        id: freecad-cache
        uses: actions/cache@v5
        with:
          path: FreeCAD.AppImage
          key: freecad-1.1.3-linux-x86_64-py311

      - name: Download verified FreeCAD 1.1.3
        if: steps.freecad-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o FreeCAD.AppImage \
            https://github.com/FreeCAD/FreeCAD/releases/download/1.1.3/FreeCAD_1.1.3-conda-Linux-x86_64-py311.AppImage

      - name: Verify and extract FreeCAD
        run: |
          set -euo pipefail
          echo "3a853eb69ee595f779f2255dbf80a765926981d8ff68903cefee4dfb03a8f5ef  FreeCAD.AppImage" | sha256sum -c -
          chmod +x FreeCAD.AppImage
          rm -rf squashfs-root
          ./FreeCAD.AppImage --appimage-extract >/dev/null
          FREECADCMD=$(find squashfs-root -type f \( -name FreeCADCmd -o -name freecadcmd \) | head -n1)
          test -n "$FREECADCMD"
          echo "FREECADCMD=$FREECADCMD" >> "$GITHUB_ENV"
          "$FREECADCMD" -c 'import FreeCAD,Part,Mesh,MeshPart; print(FreeCAD.Version()); assert Part.makeBox(1,1,1).isValid()'

      - name: Compile v60 builders
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/build_v60.py \
            scripts/build_v60_continuous_carrier.py \
            scripts/build_v60_full.py \
            scripts/build_v60_full_baseline.py \
            scripts/apply_v60_box_clamp_prereq.py \
            scripts/apply_v60_front_rebuild_v2.py \
            scripts/apply_v60_front_rebuild_v5.py \
            scripts/apply_v60_front_rebuild_v6.py \
            scripts/apply_v60_front_rework.py \
            scripts/apply_v60_front_final.py \
            scripts/apply_v60_front_position_fix.py \
            scripts/apply_v60_final_assembly.py \
            scripts/apply_v60_rack_closure.py \
            scripts/apply_v60_retainer_thread_final.py \
            scripts/check_v60_all_thread_access.py \
            scripts/check_v60_rack_closure_exports.py \
            scripts/check_v60_workflow_contract.py \
            scripts/run_v60_full_ci.py \
            scripts/run_v60_continuous_ci.py \
            scripts/v60_timing.py

      - name: Build and hard-check complete direct v60
        run: |
          set -euo pipefail
          START=$(date +%s)
          "$FREECADCMD" -c "import sys; sys.path.insert(0, 'scripts'); import run_v60_continuous_ci" 2>&1 | tee build_v60.log
          END=$(date +%s)
          echo $((END-START)) > build_v60/build_seconds.txt

          test -s build_v60/VALIDATION_v60.json
          test -s build_v60/VALIDATION_v60_full.json
          test -s build_v60/TIMING_v60.json
          test -s build_v60/eurobox_v60_base_right.step
          test -s build_v60/eurobox_v60_base_left.step
          test -s build_v60/eurobox_v60_base_right.stl
          test -s build_v60/eurobox_v60_base_left.stl
          test -s build_v60/eurobox_v60_rack_nut_retainer.stl
          test -s build_v60/eurobox_v60_lead_nut.stl
          test -s build_v60/eurobox_v60_lead_nut_retaining_pin.stl
          test -s build_v60/eurobox_v60_lead_nut_pin_clip.stl
          test -s build_v60/eurobox_v60_knob_retainer_nut.stl
          test -s build_v60/eurobox_v60_assembly.FCStd
          python3 scripts/check_v60_workflow_contract.py

      - name: Render installed-orientation v60 preview PNG
        run: |
          set -euo pipefail
          xvfb-run -a openscad \
            --imgsize=1600,1000 \
            --projection=ortho \
            --viewall \
            --autocenter \
            --camera=0,0,0,58,0,32,720 \
            -o build_v60/eurobox_v60_preview.png \
            scripts/preview_v60.scad
          test -s build_v60/eurobox_v60_preview.png

      - name: Publish validated v60 CAD into repository
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          rm -rf cad/v60 preview-stl/v60
          mkdir -p cad/v60/FCStd cad/v60/STEP cad/v60/STL cad/v60/assembly cad/v60/validation preview-stl/v60

          for f in build_v60/eurobox_v60_*.FCStd; do
            base=$(basename "$f")
            if [ "$base" = "eurobox_v60_assembly.FCStd" ]; then
              bytes=$(stat -c '%s' "$f")
              mib=$(awk -v bytes="$bytes" 'BEGIN { printf "%.2f", bytes / 1048576 }')
              echo "::notice title=Assembly kept in workflow artifact::$base is ${mib} MiB (${bytes} bytes); not committing it to normal Git"
              continue
            fi
            cp "$f" "cad/v60/FCStd/$base"
          done
          cp build_v60/eurobox_v60_*.step cad/v60/STEP/
          cp build_v60/eurobox_v60_*.stl cad/v60/STL/
          cp build_v60/eurobox_v60_*.stl preview-stl/v60/
          cp build_v60/eurobox_v60_preview.png cad/v60/assembly/eurobox_v60_preview.png
          cp build_v60/eurobox_v60_preview.png preview-stl/v60/eurobox_v60_preview.png
          cp build_v60/VALIDATION_v60.json build_v60/VALIDATION_v60_full.json build_v60/TIMING_v60.json cad/v60/validation/

          cat > cad/v60/README.md <<'EOF'
          # Eurobox carrier v60

          Canonical clean rebuild generated and hard-validated by `scripts/build_v60.py`, `scripts/build_v60_continuous_carrier.py` and `scripts/build_v60_full.py`.

          Structural principle: one continuous rack-side carrier. The two rack clamps and the rear stop hang from this carrier; the long box-support holms fuse into the same load path.

          - `FCStd/` — individual editable FreeCAD parts
          - `STEP/` — neutral CAD exports
          - `STL/` — printable handed meshes and removable clamp hardware
          - `assembly/` — installed-orientation PNG
          - `validation/` — machine-readable hard-check and timing reports
          - workflow artifact `eurobox-v60-complete` — complete generated FreeCAD assembly and all proof outputs

          The box clamp keeps a 160 mm central clamp face. Its front assembly position is validated separately by the production front-position stage. The working RH8x2 lead nut is a replaceable cartridge; its spindle, 30 mm hand knob and open-ended RH8x2 knob retainer have explicit full-travel service-access checks. The rack closure retains its explicit matched 12x2 service-retainer thread pair with a hard top-access/unscrew audit. No printed working thread is accepted behind a closed wall.

          `validation/TIMING_v60.json` records measured stage/operation durations from the GitHub runner so expensive OCC operations can be optimized from data rather than guesswork.
          EOF

          cat > preview-stl/v60/README.md <<'EOF'
          # v60 preview/print meshes

          Validated v60 STL exports mirrored from `cad/v60/STL/` by the production v60 workflow.

          `eurobox_v60_preview.png` shows the actual installed orientation: RIGHT is translated to the +Y rack tube; LEFT is the handed printable STL rotated 180 degrees about Z and translated to the -Y rack tube. The long carriers therefore point outward on both sides.
          EOF

          max_git_bytes=$((100 * 1024 * 1024))
          while IFS= read -r -d '' generated; do
            bytes=$(stat -c '%s' "$generated")
            if (( bytes > max_git_bytes )); then
              echo "::error title=Generated repository file too large::$generated is $bytes bytes; keep it in the workflow artifact or move the repository to Git LFS"
              exit 1
            fi
          done < <(find cad/v60 preview-stl/v60 -type f -print0)

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cad/v60 preview-stl/v60
          if git diff --cached --quiet; then
            echo "Validated v60 repository outputs already current"
          else
            git commit -m "Publish continuous-carrier v60 meshes and preview"
            git push
          fi

      - name: Upload complete v60 proof
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: eurobox-v60-complete
          path: |
            build_v60/VALIDATION_v60.json
            build_v60/VALIDATION_v60_full.json
            build_v60/TIMING_v60.json
            build_v60/README_BUILD_v60.txt
            build_v60/README_BUILD_v60_full.txt
            build_v60/eurobox_v60_*.step
            build_v60/eurobox_v60_*.FCStd
            build_v60/eurobox_v60_*.stl
            build_v60/eurobox_v60_preview.png
            build_v60/build_seconds.txt
            build_v60.log