name: Build Eurobox v60

on:
  workflow_dispatch:
  push:
    branches: [v60-clean]
    paths:
      - "scripts/build_v60.py"
      - "docs/V60_**"
      - ".github/workflows/build-v60.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  structural-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Install runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 xvfb

      - name: Cache FreeCAD AppImage
        id: freecad-cache
        uses: actions/cache@v5
        with:
          path: FreeCAD.AppImage
          key: freecad-1.1.3-linux-x86_64-py311

      - name: Download verified FreeCAD 1.1.3
        if: steps.freecad-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o FreeCAD.AppImage \
            https://github.com/FreeCAD/FreeCAD/releases/download/1.1.3/FreeCAD_1.1.3-conda-Linux-x86_64-py311.AppImage

      - name: Verify and extract FreeCAD
        run: |
          set -euo pipefail
          echo "3a853eb69ee595f779f2255dbf80a765926981d8ff68903cefee4dfb03a8f5ef  FreeCAD.AppImage" | sha256sum -c -
          chmod +x FreeCAD.AppImage
          rm -rf squashfs-root
          ./FreeCAD.AppImage --appimage-extract >/dev/null
          FREECADCMD=$(find squashfs-root -type f \( -name FreeCADCmd -o -name freecadcmd \) | head -n1)
          test -n "$FREECADCMD"
          echo "FREECADCMD=$FREECADCMD" >> "$GITHUB_ENV"
          "$FREECADCMD" -c 'import FreeCAD,Part; print(FreeCAD.Version()); assert Part.makeBox(1,1,1).isValid()'

      - name: Compile v60 builder
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/build_v60.py

      - name: Build and hard-check clean structural core
        run: |
          set -euo pipefail
          "$FREECADCMD" scripts/build_v60.py | tee build_v60.log
          test -s build_v60/VALIDATION_v60.json
          test -s build_v60/eurobox_v60_base_right_core.step
          test -s build_v60/eurobox_v60_base_left_core.step
          python3 - <<'PY'
          import json
          v = json.load(open('build_v60/VALIDATION_v60.json'))
          assert not v['failures'], v['failures']
          assert v['datums']['clamp_spacing_mm'] == 160.0
          assert v['geometry']['right_bbox_mm'][0] <= 296.0
          assert v['geometry']['right_bbox_mm'][1] <= 275.0
          assert v['geometry']['mirror_delta_mm3'] <= 0.0001
          PY

      - name: Upload v60 structural proof
        uses: actions/upload-artifact@v6
        with:
          name: eurobox-v60-structural-core
          path: |
            build_v60/VALIDATION_v60.json
            build_v60/README_BUILD_v60.txt
            build_v60/eurobox_v60_base_right_core.step
            build_v60/eurobox_v60_base_left_core.step
            build_v60/eurobox_v60_base_right_core.FCStd
            build_v60/eurobox_v60_base_left_core.FCStd
            build_v60/eurobox_v60_base_right_core.stl
            build_v60/eurobox_v60_base_left_core.stl
            build_v60.log
