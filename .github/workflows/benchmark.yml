name: CAD benchmark

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/benchmark.py"
      - ".github/workflows/benchmark.yml"

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openscad libfuse2

      - name: Cache FreeCAD AppImage
        id: cache-freecad
        uses: actions/cache@v4
        with:
          path: FreeCAD.AppImage
          key: freecad-1.1.3-linux-x86_64-py311

      - name: Download verified FreeCAD 1.1.3
        if: steps.cache-freecad.outputs.cache-hit != 'true'
        run: |
          curl -L --fail --retry 3 -o FreeCAD.AppImage \
            https://github.com/FreeCAD/FreeCAD/releases/download/1.1.3/FreeCAD_1.1.3-Linux-x86_64-py311.AppImage

      - name: Verify and extract FreeCAD
        run: |
          echo "3a853eb69ee595f779f2255dbf80a765926981d8ff68903cefee4dfb03a8f5ef  FreeCAD.AppImage" | sha256sum -c -
          chmod +x FreeCAD.AppImage
          ./FreeCAD.AppImage --appimage-extract >/dev/null

      - name: Run representative CAD benchmark
        run: |
          START=$(date +%s)
          ./squashfs-root/usr/bin/FreeCADCmd scripts/benchmark.py | tee benchmark.log
          END=$(date +%s)
          echo "wall_seconds=$((END-START))" | tee walltime.txt

      - uses: actions/upload-artifact@v4
        with:
          name: cad-benchmark
          path: |
            benchmark_out/benchmark.json
            benchmark.log
            walltime.txt
          retention-days: 7
