name: Build v60 rack hand knob

# Component-only workflow.  It deliberately does not import/build either BASE,
# the rack-retainer thread stage or the final v60 assembly.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/v60_rack_hand_knob.py"
      - "scripts/v60_knob_profile.py"
      - "scripts/run_v60_rack_hand_knob_ci.py"
      - ".github/workflows/build-v60-rack-hand-knob.yml"

concurrency:
  group: v60-rack-hand-knob-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  rack-hand-knob:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Install minimal runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2

      - name: Cache FreeCAD AppImage
        id: freecad-cache
        uses: actions/cache@v5
        with:
          path: FreeCAD.AppImage
          key: freecad-1.1.3-linux-x86_64-py311

      - name: Download verified FreeCAD 1.1.3
        if: steps.freecad-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o FreeCAD.AppImage \
            https://github.com/FreeCAD/FreeCAD/releases/download/1.1.3/FreeCAD_1.1.3-conda-Linux-x86_64-py311.AppImage

      - name: Verify and extract FreeCAD
        run: |
          set -euo pipefail
          echo "3a853eb69ee595f779f2255dbf80a765926981d8ff68903cefee4dfb03a8f5ef  FreeCAD.AppImage" | sha256sum -c -
          chmod +x FreeCAD.AppImage
          rm -rf squashfs-root
          ./FreeCAD.AppImage --appimage-extract >/dev/null
          FREECADCMD=$(find squashfs-root -type f \( -name FreeCADCmd -o -name freecadcmd \) | head -n1)
          test -n "$FREECADCMD"
          echo "FREECADCMD=$FREECADCMD" >> "$GITHUB_ENV"

      - name: Compile component builder
        run: |
          python3 -m py_compile \
            scripts/v60_knob_profile.py \
            scripts/v60_rack_hand_knob.py \
            scripts/run_v60_rack_hand_knob_ci.py

      - name: Build and validate rack hand knob only
        run: |
          set -euo pipefail
          "$FREECADCMD" -c "import sys; sys.path.insert(0, 'scripts'); import run_v60_rack_hand_knob_ci"
          test -s build_v60_rack_knob/eurobox_v60_rack_hand_knob.step
          test -s build_v60_rack_knob/eurobox_v60_rack_hand_knob.FCStd
          test -s build_v60_rack_knob/eurobox_v60_rack_hand_knob.stl
          test -s build_v60_rack_knob/VALIDATION_v60_rack_hand_knob.json

      - name: Publish validated knob only
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          mkdir -p cad/v60/FCStd cad/v60/STEP cad/v60/STL cad/v60/validation preview-stl/v60
          cp build_v60_rack_knob/eurobox_v60_rack_hand_knob.FCStd cad/v60/FCStd/
          cp build_v60_rack_knob/eurobox_v60_rack_hand_knob.step cad/v60/STEP/
          cp build_v60_rack_knob/eurobox_v60_rack_hand_knob.stl cad/v60/STL/
          cp build_v60_rack_knob/eurobox_v60_rack_hand_knob.stl preview-stl/v60/
          cp build_v60_rack_knob/VALIDATION_v60_rack_hand_knob.json cad/v60/validation/

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cad/v60 preview-stl/v60
          if git diff --cached --quiet; then
            echo "Rack hand knob outputs already current"
          else
            git commit -m "Publish v60 rack hand knob"
            git push
          fi

      - name: Upload rack hand knob proof
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: eurobox-v60-rack-hand-knob
          path: build_v60_rack_knob/
