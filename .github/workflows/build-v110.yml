name: Build Eurobox v110 left-hand service retainer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/build_v110_left_hand_retainer.py"
      - ".github/workflows/build-v110.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Install runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2

      - name: Cache FreeCAD AppImage
        id: freecad-cache
        uses: actions/cache@v5
        with:
          path: FreeCAD.AppImage
          key: freecad-1.1.3-linux-x86_64-py311

      - name: Download verified FreeCAD 1.1.3
        if: steps.freecad-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o FreeCAD.AppImage             https://github.com/FreeCAD/FreeCAD/releases/download/1.1.3/FreeCAD_1.1.3-Linux-x86_64-py311.AppImage

      - name: Verify and extract FreeCAD
        run: |
          set -euo pipefail
          echo "3a853eb69ee595f779f2255dbf80a765926981d8ff68903cefee4dfb03a8f5ef  FreeCAD.AppImage" | sha256sum -c -
          chmod +x FreeCAD.AppImage
          rm -rf squashfs-root
          ./FreeCAD.AppImage --appimage-extract >/dev/null
          FREECADCMD=$(find squashfs-root -type f \( -name FreeCADCmd -o -name freecadcmd \) | head -n1)
          test -n "$FREECADCMD"
          echo "FREECADCMD=$FREECADCMD" >> "$GITHUB_ENV"
          "$FREECADCMD" -c 'import FreeCAD,Part,Mesh,Import; print(FreeCAD.Version()); assert Part.makeBox(1,1,1).isValid()'

      - name: Build and validate v110 service retainer
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/build_v110_left_hand_retainer.py
          rm -rf build_v110
          "$FREECADCMD" -c "import sys; sys.path.insert(0, 'scripts'); import build_v110_left_hand_retainer" 2>&1 | tee build_v110.log

          test -s build_v110/eurobox_v110_rack_nut_retainer_left_hand.step
          test -s build_v110/eurobox_v110_rack_nut_retainer_left_hand.FCStd
          test -s build_v110/eurobox_v110_rack_nut_retainer_left_hand.stl
          test -s build_v110/VALIDATION_v110.json

          python3 - <<'PY'
          import json, struct
          from pathlib import Path
          v = json.loads(Path('build_v110/VALIDATION_v110.json').read_text())
          assert v['failures'] == []
          assert v['thread_handedness_reversed'] is True
          assert v['mirror_back_signature_equal'] is True
          assert v['intended_base'] == 'current v100 LEFT base only'

          p = Path('build_v110/eurobox_v110_rack_nut_retainer_left_hand.stl')
          data = p.read_bytes()
          assert len(data) >= 84
          n = struct.unpack('<I', data[80:84])[0]
          assert len(data) == 84 + 50*n, 'v110 service retainer is not canonical binary STL'
          PY

      - name: Publish v110 complete set
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          mkdir -p cad/v110/FCStd cad/v110/STEP cad/v110/STL cad/v110/SCAD cad/v110/validation preview-stl/v110

          rm -f cad/v110/FCStd/eurobox_v110_*.FCStd
          rm -f cad/v110/STEP/eurobox_v110_*.step
          rm -f cad/v110/STL/eurobox_v110_*.stl
          rm -f cad/v110/SCAD/eurobox_v110_*.scad
          rm -f preview-stl/v110/eurobox_v110_*.stl

          for src in cad/v100/FCStd/eurobox_v100_*.FCStd; do
            base=$(basename "$src")
            dst=$(printf '%s\n' "$base" | sed 's/eurobox_v100_/eurobox_v110_/')
            cp "$src" "cad/v110/FCStd/$dst"
          done
          for src in cad/v100/STEP/eurobox_v100_*.step; do
            base=$(basename "$src")
            dst=$(printf '%s\n' "$base" | sed 's/eurobox_v100_/eurobox_v110_/')
            cp "$src" "cad/v110/STEP/$dst"
          done
          for src in cad/v100/STL/eurobox_v100_*.stl; do
            base=$(basename "$src")
            dst=$(printf '%s\n' "$base" | sed 's/eurobox_v100_/eurobox_v110_/')
            cp "$src" "cad/v110/STL/$dst"
          done
          for src in cad/v100/SCAD/eurobox_v100_*.scad; do
            base=$(basename "$src")
            dst=$(printf '%s\n' "$base" | sed 's/eurobox_v100_/eurobox_v110_/')
            cp "$src" "cad/v110/SCAD/$dst"
          done

          cp build_v110/eurobox_v110_rack_nut_retainer_left_hand.FCStd cad/v110/FCStd/
          cp build_v110/eurobox_v110_rack_nut_retainer_left_hand.step cad/v110/STEP/
          cp build_v110/eurobox_v110_rack_nut_retainer_left_hand.stl cad/v110/STL/
          cp build_v110/VALIDATION_v110.json cad/v110/validation/

          cp cad/v110/STL/eurobox_v110_*.stl preview-stl/v110/

          python3 - <<'PY'
          import struct
          from pathlib import Path
          for p in sorted(Path('cad/v110/STL').glob('eurobox_v110_*.stl')):
              data = p.read_bytes()
              assert len(data) >= 84, p
              n = struct.unpack('<I', data[80:84])[0]
              assert len(data) == 84 + 50*n, f'{p} is not canonical binary STL'
          assert Path('cad/v110/STL/eurobox_v110_rack_nut_retainer.stl').exists()
          assert Path('cad/v110/STL/eurobox_v110_rack_nut_retainer_left_hand.stl').exists()
          PY

          cat > cad/v110/README.md <<'EOF'
          # Eurobox carrier v110

          V110 is a service-workaround release based on V100.

          The existing V100 design is promoted unchanged, and one additional part is added:

          - eurobox_v110_rack_nut_retainer_left_hand

          This additional retainer is the exact X-mirror of the normal V100/V110 rack-nut retainer. Mirroring reverses the thread chirality while keeping the Z thread axis and insertion direction unchanged.

          Use:
          - current RIGHT base -> standard eurobox_v110_rack_nut_retainer
          - current LEFT mirrored base -> eurobox_v110_rack_nut_retainer_left_hand

          The left-hand service retainer tightens in the opposite rotational direction to the standard retainer.

          This avoids reprinting the already-finished mirrored LEFT base. It is a compatibility workaround for the currently released mirrored female thread, not a reason to use opposite-handed threads in future base revisions.

          All STL files are canonical binary STL. ASCII STL is rejected by the build/publish gate.
          EOF

          cat > preview-stl/v110/README.md <<'EOF'
          # v110 preview/print meshes

          Complete binary STL mirror of cad/v110/STL/.

          V110 adds a left-hand rack-nut service retainer for the currently mirrored LEFT base while retaining the standard retainer for the RIGHT base.
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cad/v110 preview-stl/v110
          if git diff --cached --quiet; then
            echo "Validated v110 repository outputs already current"
          else
            git commit -m "Publish v110 left-hand service retainer"
            git pull --rebase origin main
            git push
          fi

      - name: Upload v110 proof
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: eurobox-v110-left-hand-retainer
          path: |
            build_v110/eurobox_v110_rack_nut_retainer_left_hand.step
            build_v110/eurobox_v110_rack_nut_retainer_left_hand.FCStd
            build_v110/eurobox_v110_rack_nut_retainer_left_hand.stl
            build_v110/VALIDATION_v110.json
            build_v110.log
